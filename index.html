<title>三年级上册 · 单词闯关</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#F6E7EB}

  .cn{font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC",serif}

  .card{background:#fff;border-radius:18px;padding:16px}
  .btn{display:block;width:100%;border:0;border-radius:16px;background:#c2708c;color:#fff;font-size:20px;font-weight:600;padding:16px;font-family:inherit}
  .btn:active{opacity:.85}
  .btn.ghost{background:#fff;color:#c2708c;border:2px solid #c2708c}
  .btn.mini{font-size:16px;padding:12px;border-radius:14px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
  .top .t1{font-size:15px;font-weight:600}
  .top .t2{font-size:11px;color:#8a6470}
  .pill{background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:#c2708c;font-weight:600}
  .bar{height:8px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;margin:0 4px 12px}
  .bar > i{display:block;height:8px;background:#c2708c;border-radius:999px;transition:width .25s}
  .qbox{background:#fff;border-radius:18px;padding:18px 16px;text-align:center}
  .emoji{font-size:76px;line-height:1.1}
  .stem{font-size:26px;font-weight:600;letter-spacing:.5px}
  .sub{font-size:13px;color:#8a6470;margin-top:6px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .opt{background:#fff;border:2px solid #F0DDE3;border-radius:16px;padding:16px 8px;font-size:22px;font-weight:600;text-align:center;font-family:inherit;color:#4a2c33}
  .opt:active{transform:scale(.98)}
  .opt.right{border-color:#0F6E56;background:#E1F5EE;color:#0F6E56}
  .opt.wrong{border-color:#A32D2D;background:#FCEBEB;color:#A32D2D}
  .opt.dim{opacity:.45}
  .speak{width:92px;height:92px;border-radius:50%;background:#c2708c;border:0;margin:6px auto 8px;display:flex;align-items:center;justify-content:center}
  .speak:active{opacity:.85}
  .speak svg{width:40px;height:40px;fill:#fff}
  .feed{margin-top:12px;border-radius:16px;padding:14px;background:#FBF3F6;border:1px solid #F0DDE3;text-align:left}
  .feed.ok{background:#EAF7F1;border-color:#BEE3D4}
  .feed.no{background:#FDF1F1;border-color:#F2CFCF}
  .feed .fh{font-size:17px;font-weight:600;margin:0 0 8px}
  .wcard{display:flex;align-items:center;gap:12px}
  .wcard .we{font-size:40px}
  .wcard .ww{font-size:24px;font-weight:700}
  .wcard .wp{font-size:13px;color:#8a6470}
  .wcard .wc{font-size:15px}
  .sent{margin-top:10px;font-size:15px;background:#fff;border-radius:12px;padding:10px 12px}
  .sent b{color:#c2708c}
  .pho{margin-top:10px;background:#fff;border-radius:12px;padding:10px 12px}
  .pho .pt{font-size:12px;color:#8a6470;margin-bottom:6px}
  .pho .prow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .pho .pk{background:#FBF3F6;border:1px solid #F0DDE3;border-radius:10px;padding:3px 8px;text-align:center}
  .pho .pk b{font-size:16px;display:block;line-height:1.2}
  .pho .pk i{font-style:normal;font-size:11px;color:#c2708c;display:block;line-height:1.3}
  .pho .plus{font-size:12px;color:#c9a9b4}
  .pho .psay{margin-left:auto;font-size:12.5px;color:#c2708c;background:none;border:1.5px solid #c2708c;border-radius:999px;padding:4px 10px;font-family:inherit}
  .pk{cursor:pointer}  .pk.on,.pk.on b,.pk.on i{background:#c2708c;border-color:#c2708c;color:#fff}
  .hint{font-size:12px;color:#8a6470;text-align:center;margin-top:10px}
  .stars{font-size:44px;letter-spacing:6px;color:#EF9F27;text-align:center;margin:6px 0}
  .miss{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F4E4E9}
  .miss .me{font-size:26px}
  .miss .mw{font-size:18px;font-weight:600}
  .miss .mc{font-size:13px;color:#8a6470}
  .row{display:flex;gap:10px;margin-top:12px}
  .row .btn{flex:1}
  ul.how{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:#6b4a55}
  ul.how li{margin-bottom:5px}
  .foot{margin-top:auto;padding-top:14px;font-size:11px;color:#8a6470;text-align:center}
  .ucard{background:#fff;border-radius:18px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-top:10px;border:0;width:100%;text-align:left;font-family:inherit;color:#4a2c33}
  .ucard:active{transform:scale(.99)}
  .ucard .ub{width:44px;height:44px;border-radius:50%;background:#c2708c;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .ucard.lock .ub{background:#E8D5DB;color:#bb93a0}
  .ucard .ut{flex:1;min-width:0}
  .ucard .uw{font-size:16.5px;font-weight:600}
  .ucard .um{font-size:12px;color:#8a6470}
  .ucard .ur{font-size:12px;color:#EF9F27;font-weight:700;letter-spacing:1px;flex-shrink:0}
  .ucard .lk{font-size:20px;flex-shrink:0}
  .back{background:none;border:0;color:#c2708c;font-size:14px;font-weight:600;padding:6px 4px;font-family:inherit;text-align:left}

function W(key){
  var u = UNITS[S.unit];
  for (var i=0;i<u.words.length;i++) if (u.words[i].w === key) return u.words[i];
  return null;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* 按题型判断某个选项值对不对：拼写题比的是「缺的那个字母」，其他题比整词 */
function onlyLetters(s){ return String(s).toUpperCase().replace(/[^A-Z]/g, ""); }
function isRightVal(q, val){
  val = String(val == null ? "" : val);
  if (q.t === "spell"){
    var pos = q.blank.indexOf("_");
    return val.toLowerCase() === q.k.charAt(pos).toLowerCase();
  }
  if (q.t === "sent") return val.trim().toLowerCase() === q.k.toLowerCase();
  return onlyLetters(val) === onlyLetters(q.k);
}
/* 纯随机洗牌（干扰项用） */
function shuffle(a){
  for (var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* 正确项的落点：均衡轮转
   做法：每 k 题算「一轮」，一轮内 k 个位置各用一次（乱序），
   并保证相邻两题不落在同一位置。
   好处：位置分布天然均匀（各 25%），不会出现「连着三道都在第 1 位」。 */
function balancedSlots(n, k){
  var out = [];
  if (k < 2){ for (var z=0;z<n;z++) out.push(0); return out; }
  while (out.length < n){
    var bag = [];
    for (var i=0;i<k;i++) bag.push(i);
    shuffle(bag);
    if (out.length){                       // 别和上一题撞在同一格
      for (var j=1;j<bag.length;j++){
        if (bag[j] !== out[out.length-1]){ var t=bag[0]; bag[0]=bag[j]; bag[j]=t; break; }
      }
    }
    out = out.concat(bag);
  }
  out = out.slice(0, n);
  for (var m=1;m<out.length;m++){          // 截断后兜底复查一次
    if (out[m] === out[m-1]){
      for (var q=m+1;q<out.length;q++){
        if (out[q] !== out[m-1] && (q+1 >= out.length || out[q+1] !== out[m])){
          var tp=out[m]; out[m]=out[q]; out[q]=tp; break;
        }
      }
    }
  }
  return out;
}

/* 按指定落点组装选项：正确项放 slot 位，干扰项随机占其余位 */
function makeOptions(q, slot){
  var src = q.o.slice(), ci = -1;
  for (var i=0;i<src.length;i++){ if (isRightVal(q, src[i])){ ci = i; break; } }
  var right = ci >= 0 ? src.splice(ci, 1)[0] : src.shift();
  var rest = shuffle(src);
  var len = q.o.length;
  slot = ((slot % len) + len) % len;
  var out = [];
  for (var k=0;k<len;k++) out.push(k === slot ? right : rest.shift());
  return out;
}

var voice = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  var vs = window.speechSynthesis.getVoices() || [];
  var prefer = ["Google US English","Samantha","Karen","Microsoft Aria","Microsoft Zira","Daniel"];
  for (var p=0;p<prefer.length;p++){

function chunkKeys(word){
  var chunks = PHO[word] || PHO[String(word).toLowerCase()];
  if (!chunks) return [];
  var out = [];
  for (var i = 0; i < chunks.length; i++) {
    var raw = String(chunks[i][1]);
    if (raw.indexOf("不发音") >= 0 || raw.indexOf("哑") >= 0) { out.push([]); continue; }
    var ipa = raw.replace(/（[^）]*）/g, "").replace(/\//g, "").replace(/\s/g, "");
    var ks = IPA2KEYS[ipa];
    out.push(ks ? ks.slice() : []);
  }
  return out;
}
var _aud = {};
function playKey(key, cb){
  if (!PHON_AUD[key]) { if (cb) setTimeout(cb, 120); return; }
  try {
    var a = _aud[key];
    if (!a) { a = new Audio(PHON_AUD[key]); _aud[key] = a; }
    a.currentTime = 0;
    a.onended = function(){ if (cb) setTimeout(cb, 90); };
    var p = a.play();
    if (p && p.catch) p.catch(function(){ if (cb) setTimeout(cb, 150); });
  } catch(e){ if (cb) setTimeout(cb, 150); }
}
function playKeys(keys, gap, cb){
  if (!keys || !keys.length) { if (cb) setTimeout(cb, 60); return; }
  var i = 0;
  function next(){
    if (i >= keys.length) { if (cb) cb(); return; }
    playKey(keys[i++], function(){ setTimeout(next, gap || 90); });
  }
  next();
}
function hiPill(idx){
  var pills = document.querySelectorAll(".pk");
  for (var j = 0; j < pills.length; j++) pills[j].className = pills[j].className.replace(" on", "");
  if (pills[idx]) pills[idx].className += " on";
}
/* 单块发音：点哪个色块就听哪个音 */
function phonicsOne(word, idx){
  var ks = chunkKeys(word);
  hiPill(idx);
  if (!ks[idx] || !ks[idx].length) return;  /* 不发音：只高亮不出声 */
  playKeys(ks[idx], 80);
}
/* 完整拼读：①逐块纯音 ②连起来 ③整词（慢→快） */
function phonicsDemo(word){
  var ks = chunkKeys(word);
  if (!ks.length) { say(word, 0.6); return; }
  try { if ("speechSynthesis" in window) window.speechSynthesis.cancel(); } catch(e){}
  var i = 0;
  function nextChunk(){
    if (i >= ks.length) { setTimeout(function(){ saySlowThenNormal(word); }, 400); return; }
    hiPill(i);
    var keys = ks[i++];
    if (!keys.length) { setTimeout(nextChunk, 320); return; }  /* 不发音：高亮但无声 */
    playKeys(keys, 80, function(){ setTimeout(nextChunk, 420); });
  }
  nextChunk();
}
/* ============ 存档 ============ */
var KEY = "g3en_v1";
function load(){
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; }
}
function save(o){
  try {
    var d = load();
    for (var k in o) d[k] = o[k];
    localStorage.setItem(KEY, JSON.stringify(d));
  } catch(e){}
}
/* 复习袋条目格式 "单元号:单词"，旧版纯单词视为第 1 单元 */
function wordIn(un, wk){
  var u = UNITS[un];
  if (!u) return null;
  for (var i=0;i<u.words.length;i++) if (u.words[i].w === wk) return u.words[i];
  return null;
}
function bagList(n){
  var d = load(), out = [];
  var arr = d.bag || [];
  for (var i=0;i<arr.length;i++){
    var it = String(arr[i]);
    var un = it.indexOf(":") >= 0 ? Number(it.split(":")[0]) : 1;
    var wk = it.indexOf(":") >= 0 ? it.split(":")[1] : it;
    if ((!n || un === n) && wordIn(un, wk)) out.push(wk);
  }
  return out;
}
function addBag(n, key){
  var d = load(), bag = d.bag || [];
  var it = n + ":" + key;
  if (bag.indexOf(it) < 0) bag.push(it);
  save({ bag: bag });
}
function removeBag(n, key){
  var d = load();
  var it = n + ":" + key;
  var bag = (d.bag || []).filter(function(x){ return x !== it; });
  save({ bag: bag });
}
function starsOf(badge){
  var d = load();
  return (d.stars && d.stars[badge]) || 0;
}
/* 解锁：第 1 关开放，其后每关需前一关拿到星星 */
function unlocked(n){
  if (n === 1) return true;
  return starsOf(UNITS[n-1].badge) >= 1;
}

/* ============ 出题顺序 ============ */
function deck(onlyKeys){

}

function renderQ(){
  var q = S.order[S.i], w = W(q.k), u = UNITS[S.unit];
  var total = S.order.length;
  var h = "";
  h += '<div class="top">';
  h +=   '<div><div class="t1">' + u.badge + " · 第 " + (S.i + 1) + " / " + total + ' 题</div><div class="t2">' + typeName(q.t) + "</div></div>";
  h +=   '<div class="pill">' + (S.streak >= 2 ? "连击 x" + S.streak : "★ " + S.correct) + "</div>";
  h += "</div>";
  h += '<div class="bar"><i style="width:' + Math.round(S.i / total * 100) + '%"></i></div>';

  if (q.t === "pic"){
    h += '<div class="qbox"><div class="emoji">' + w.e + '</div><div class="sub">这是什么？选出正确的单词</div></div>';
  } else if (q.t === "listen"){
    h += '<div class="qbox">';
    h +=   '<button class="speak" id="play"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>';
    h +=   '<div class="sub">点喇叭听发音，选出你听到的单词</div>';
    h += "</div>";
  } else if (q.t === "spell"){
    h += '<div class="qbox"><div class="emoji">' + w.e + '</div><div class="stem">' + q.blank.replace(/_/g, "＿") + '</div><div class="sub">' + esc(w.cn) + " · 选出缺的那个字母</div></div>";
  } else {
    h += '<div class="qbox"><div class="emoji" style="font-size:40px">' + w.e + '</div><div class="stem" style="font-size:21px;line-height:1.5">' + esc(q.blank) + '</div><div class="sub">选一个词填进句子</div></div>';
  }

  h += '<div class="opts" id="opts">';
  var slot = (S.slot && S.slot.length) ? S.slot[S.i] : Math.floor(Math.random() * q.o.length);
  S.opts = makeOptions(q, slot);
  for (var i=0;i<S.opts.length;i++){
    h += '<button class="opt" data-v="' + i + '">' + esc(S.opts[i]) + "</button>";
  }
  h += "</div>";
  h += '<div id="feed"></div>';
  h += '<div class="foot">' + (S.sound ? "" : "声音已关 · ") + "答错不扣分，会进复习袋</div>";
  app.innerHTML = h;

  var btns = app.querySelectorAll(".opt");
  for (var b=0;b<btns.length;b++) btns[b].onclick = onPick;
  if (q.t === "listen"){
    document.getElementById("play").onclick = function(){ say(q.k); };
    setTimeout(function(){ say(q.k); }, 350);
  }
}

function typeName(t){
  return t === "pic" ? "看图选词" : t === "listen" ? "听音选词" : t === "spell" ? "补全拼写" : "句子填空";
}

function onPick(ev){
  if (S.picked !== null) return;
  var idx = Number(ev.currentTarget.getAttribute("data-v"));
  var q = S.order[S.i], w = W(q.k);
  var ok = isRightVal(q, S.opts[idx]);
  S.picked = idx;
  var btns = app.querySelectorAll(".opt");
  for (var i=0;i<btns.length;i++){
    var v = Number(btns[i].getAttribute("data-v"));
    var isRight = isRightVal(q, S.opts[v]);
    if (isRight) btns[i].className = "opt right";
    else if (v === idx) btns[i].className = "opt wrong";
    else btns[i].className = "opt dim";
  }
  if (ok){
    S.correct++; S.streak++;
    say(q.k);
  } else {
    S.streak = 0;
    if (S.miss.indexOf(q.k) < 0) S.miss.push(q.k);
    addBag(S.unit, q.k);
    say(q.k);
  }

  var f = document.getElementById("feed");
  f.innerHTML = feedHTML(q, w, ok);
  wireFeed(q, w);

  var last = (S.i === S.order.length - 1);
  var nb = document.getElementById("next");
  nb.onclick = function(){ last ? finish() : (S.i++, S.picked = null, renderQ()); };
  if (nb.scrollIntoView) nb.scrollIntoView({ block:"nearest" });
}

function phoHTML(w){
  var chunks = PHO[w.w] || PHO[String(w.w).toLowerCase()];
  if (!chunks) return "";
  var h = '<div class="pho"><div class="pt cn">自然拼读 · 一个音一个音拼</div><div class="prow">';
  for (var i=0;i<chunks.length;i++){
    if (i) h += '<span class="plus">+</span>';
    h += '<span class="pk"><b>' + esc(chunks[i][0]) + "</b><i>" + esc(chunks[i][1]) + "</i></span>";
  }
  h += '<button class="psay cn" id="blend">🔊 一个音一个音拼读</button></div>';
  h += '<div class="cn" style="font-size:11.5px;color:#8a6470;margin-top:6px">点色块听单个音（真人发音）→ 点按钮把音连成词 → 整词读两遍</div></div>';
  return h;
}

function feedHTML(q, w, ok){
  var h = '<div class="feed ' + (ok ? "ok" : "no") + '">';
  h += '<p class="fh">' + (ok ? "对了 " + pick(["漂亮！", "答对啦！", "就是它！", "太棒了！"]) : "差一点 · 正确答案是 " + w.w) + "</p>";
  h += '<div class="wcard"><div class="we">' + w.e + "</div>";
  h +=   '<div style="flex:1"><div class="ww">' + w.w + ' <span style="font-size:14px;color:#8a6470;font-weight:400">' + w.ph + "</span></div>";
  h +=   '<div class="wc cn">' + esc(w.cn) + "</div></div>";
  h +=   '<button class="btn ghost mini" id="again" style="width:auto;padding:10px 14px">🔊</button></div>';
  h += phoHTML(w);
  h += '<div class="sent cn"><div style="display:flex;align-items:center;gap:10px"><span style="flex:1">' + esc(w.s) + (w.from ? ' <span style="font-size:11px;color:#8a6470">（' + w.from + "）</span>" : "") + '</span><button class="btn ghost mini" id="saysent" style="width:auto;padding:8px 12px;flex-shrink:0">🔊 读句子（慢→快）</button></div>';
  var scn = SENT_CN[w.s];
  if (scn) h += '<div style="font-size:12.5px;color:#8a6470;margin-top:5px">' + esc(scn) + "</div>";
  h += "</div>";
  if (!ok && q.t !== "listen") h += '<div style="font-size:12.5px;color:#8a6470;margin-top:8px" class="cn">听一遍发音，跟着读两遍，再往下走 →</div>';
  h += '<div style="margin-top:12px"><button class="btn" id="next">' + (S.i === S.order.length - 1 ? "看结果" : "下一题") + "</button></div>";
  h += "</div>";
  return h;
}
function wireFeed(q, w){
  document.getElementById("again").onclick = function(){ say(w.w, 0.7); };
  var bl = document.getElementById("blend");
  if (bl) bl.onclick = function(){ phonicsDemo(w.w); };
  var pills = document.querySelectorAll(".pk");
  for (var i=0;i<pills.length;i++){
    (function(idx){ pills[idx].onclick = function(){ phonicsOne(w.w, idx); }; })(i);
  }
  var ss = document.getElementById("saysent");
  if (ss) ss.onclick = function(){ saySlowThenNormal(w.s); };
}

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ============ 结果 ============ */
function finish(){
  var u = UNITS[S.unit];
  var total = S.order.length;
  var acc = total ? S.correct / total : 0;
  var stars = acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : acc >= 0.5 ? 1 : 0;

  var d = load();
  var starMap = d.stars || {};
  starMap[u.badge] = Math.max(starMap[u.badge] || 0, stars);
  save({ stars: starMap });

  if (stars >= 2) S.miss.forEach(function(k){ removeBag(S.unit, k); });

  S.screen = "result";
  var h = "";
  h += '<div class="top"><div><div class="t1">' + u.badge + " · 结果</div><div class=\"t2\">" + total + " 题答对 " + S.correct + ' 题</div></div><div class="pill">★ ' + stars + "</div></div>";
  h += '<div class="card">';
  h +=   '<div class="stars">' + "★★★".slice(0, stars) + '<span style="color:#E8D5DB">' + "★★★".slice(0, 3 - stars) + "</span></div>";
  h +=   '<div style="text-align:center;font-size:16px;font-weight:600">' + (stars === 3 ? "满星通关！" : stars === 2 ? "过关啦！" : stars === 1 ? "勉强过关，再练练" : "再来一次会更好") + "</div>";
  h +=   '<div style="text-align:center;font-size:12.5px;color:#8a6470;margin-top:6px" class="cn">正确率 ' + Math.round(acc*100) + "% · 最高连击 " + S.streak + "</div>";
  if (S.miss.length){
    h += '<div style="margin-top:14px"><div style="font-size:14px;font-weight:600">要再练的词（' + S.miss.length + "）</div>";
    for (var i=0;i<S.miss.length;i++){
      var w = W(S.miss[i]);
      h += '<div class="miss"><div class="me">' + w.e + '</div><div style="flex:1"><div class="mw">' + w.w + " <span style=\"font-size:12px;color:#8a6470;font-weight:400\">" + w.ph + '</span></div><div class="mc cn">' + esc(w.cn) + '</div></div><button class="btn ghost mini" data-say="' + w.w + '" style="width:auto;padding:8px 12px">🔊</button></div>';
    }
    h += "</div>";
    h += '<div class="row"><button class="btn" id="redo">先练这 ' + S.miss.length + " 个词</button></div>";
  } else {
    h += '<div style="margin-top:14px;font-size:14px" class="cn">全部答对，没有要补的词 🎉</div>';
  }
  h +=   '<div class="row"><button class="btn ghost" id="home">回地图</button><button class="btn ghost" id="all">整关重玩</button></div>';
  h += "</div>";
  h += '<div class="foot">' + (stars >= 1 && UNITS[S.unit + 1] ? "下一关已解锁，回地图看看 →" : "下次打开还能接着练") + "</div>";
  app.innerHTML = h;

  var sbs = app.querySelectorAll("[data-say]");
  for (var s=0;s<sbs.length;s++) sbs[s].onclick = function(e){ say(e.currentTarget.getAttribute("data-say"), 0.72); };
  document.getElementById("home").onclick = renderHome;
  document.getElementById("all").onclick = function(){ start(deck()); };
  var rd = document.getElementById("redo");
  if (rd) rd.onclick = function(){ start(deck(S.miss.slice())); };
  say("Well done!");
}

renderHome();
</script>
